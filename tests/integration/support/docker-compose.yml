# Local/CI infrastructure for Phase 81 integration tests (ACD-OPS-001).
# Usage (from repository root):
#   docker compose -f tests/integration/support/docker-compose.yml up -d
# Then export:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cartoon
#   REDIS_URL=redis://localhost:6379/0
#   FAKE_API_KEY=integration-fake-key
#   POSTGRES_USER=postgres
#   POSTGRES_PASSWORD=postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cartoon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartoon"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
