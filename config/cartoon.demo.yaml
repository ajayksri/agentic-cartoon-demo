# Local demo config template
# Copy to config/cartoon.yaml or set CARTOON_CONFIG_PATH to this file.
# All agents use provider "fake" — no paid LLM credentials required.

config_version: "1"

infrastructure:
  postgres:
    host: localhost
    port: 5432
    database: cartoon
    user_env: POSTGRES_USER
    password_env: POSTGRES_PASSWORD
  redis:
    host: localhost
    port: 6379
    db: 0

agents:
  topic_selector:
    provider: fake
    model: fake-model
    prompt_file: tests/fixtures/agents/prompts/topic_selector.txt
  scenario_generator:
    provider: fake
    model: fake-model
    prompt_file: tests/fixtures/agents/prompts/scenario_generator.txt
  critic:
    provider: fake
    model: fake-model
    prompt_file: tests/fixtures/agents/prompts/critic.txt

providers:
  fake:
    api_key_env: FAKE_API_KEY

collection:
  candidate_count: 10

workflow:
  max_scenario_revisions: 2

workers:
  topic_selector_concurrency: 1
  scenario_generator_concurrency: 1
  critic_concurrency: 1

retry:
  COLLECT:
    max_attempts: 3
    backoff:
      initial_seconds: 1.0
      multiplier: 2.0
      max_seconds: 30.0
  SELECT_TOPIC:
    max_attempts: 3
    backoff:
      initial_seconds: 1.0
      multiplier: 2.0
      max_seconds: 30.0
  GENERATE_SCENARIO:
    max_attempts: 3
    backoff:
      initial_seconds: 1.0
      multiplier: 2.0
      max_seconds: 30.0
  REVIEW_SCENARIO:
    max_attempts: 3
    backoff:
      initial_seconds: 1.0
      multiplier: 2.0
      max_seconds: 30.0

timeouts:
  fake:
    read_seconds: 30.0

failure_injection:
  enabled: false
  active_injections: []
