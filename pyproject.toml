[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents = ["schemas/*.json"]

[project]
name = "agentic-cartoon-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "psycopg_pool>=3.1,<4",
    "redis>=5.0",
    "aiohttp>=3.9,<4",
    "httpx>=0.27.0",
    "openai>=1.55.0,<2",
    "anthropic>=0.45.0,<1",
    "google-genai>=2.0.0,<3",
    "jsonschema>=4.20.0,<5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0,<1",
    "httpx2>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "expect_fail: pre-code mold — expected to fail until task implementation completes",
    "cfg_tc: config contract test case ID",
    "ct_obs: observability contract test case ID",
    "pers_tc: persistence contract test case ID",
    "tq_tc: task_queue contract test case ID",
    "ct_finj: failure_injection contract test case ID",
    "col_tc: collector contract test case ID",
    "prv_tc: providers contract test case ID",
    "wf_tc: workflow contract test case ID",
    "agt_tc: agents contract test case ID",
    "api_tc: api contract test case ID",
]

[project.optional-dependencies]
dev = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "testcontainers[postgres]>=4.0",
]

