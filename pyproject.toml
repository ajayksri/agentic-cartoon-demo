[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "agentic-cartoon-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []   # filled incrementally

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "expect_fail: pre-code mold — expected to fail until task implementation completes",
    "cfg_tc: config contract test case ID",
    "ct_obs: observability contract test case ID",
]

[project.optional-dependencies]
dev = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

